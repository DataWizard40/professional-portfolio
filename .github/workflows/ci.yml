name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [inventory-orders-api, library-management-api]

    # A real MySQL database for the migration check and the MySQL test run.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check code style
        run: ruff check . && ruff format --check .

      - name: Check database migrations
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/test_db
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Run tests (SQLite)
        run: pytest

      - name: Run tests (MySQL)
        env:
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/test_db
        run: pytest
